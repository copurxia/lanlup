name: Nightly Catalog Release

# 轻量 catalog：master push 后不再重编 40 个插件，只等待本次受影响的
# per-plugin 资产刷新，然后从已发布的 wasm 重新生成 plugins.json。
# 插件 wasm 本身由各 <plugin>-wasip1.yml 在 push 时构建并发布。

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      plugins:
        description: 'Deprecated / no-op: catalog always rebuilds from all published assets'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: true

jobs:
  changed:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.compute.outputs.mode }}
      plugins: ${{ steps.compute.outputs.plugins }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute wait scope
        id: compute
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "mode=none" >> "${GITHUB_OUTPUT}"
            echo "plugins=" >> "${GITHUB_OUTPUT}"
            echo "workflow_dispatch: regenerating catalog from current assets"
            exit 0
          fi

          before="${{ github.event.before }}"
          head="${GITHUB_SHA}"
          if [ -z "${before}" ] || [ "${before}" = "0000000000000000000000000000000000000000" ]; then
            before="$(git rev-parse "${head}^" 2>/dev/null || true)"
          fi
          # Force push / unreachable parent: fall back to waiting for all assets.
          if [ -z "${before}" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "mode=all" >> "${GITHUB_OUTPUT}"
            echo "plugins=" >> "${GITHUB_OUTPUT}"
            echo "previous commit unreachable; waiting for all assets"
            exit 0
          fi

          files="$(git diff --name-only "${before}" "${head}")"
          printf 'changed files:\n%s\n' "${files}"

          all=0
          plugin_list="$(mktemp)"
          while IFS= read -r f; do
            [ -n "${f}" ] || continue
            case "${f}" in
              .github/workflows/_build-wasip1.yml)
                all=1
                ;;
              .github/workflows/*-wasip1.yml)
                base="${f##*/}"
                plugin="${base%-wasip1.yml}"
                [ -n "${plugin}" ] && printf '%s\n' "${plugin}" >> "${plugin_list}"
                ;;
              .github/*)
                # Non-plugin GitHub workflow (aggregate/tooling): no builds triggered.
                ;;
              .gitea/*)
                # Other forge workflow: GitHub runners will not build anything.
                ;;
              *)
                case "${f%%/*}" in
                  *-rs) printf '%s\n' "${f%%/*}" >> "${plugin_list}" ;;
                esac
                ;;
            esac
          done <<< "${files}"

          if [ "${all}" -eq 1 ]; then
            echo "mode=all" >> "${GITHUB_OUTPUT}"
            echo "plugins=" >> "${GITHUB_OUTPUT}"
            echo "shared build workflow changed: waiting for all plugin assets"
          elif [ -s "${plugin_list}" ]; then
            plugins="$(sort -u "${plugin_list}" | paste -sd, -)"
            echo "mode=list" >> "${GITHUB_OUTPUT}"
            echo "plugins=${plugins}" >> "${GITHUB_OUTPUT}"
            echo "plugin changes: ${plugins}"
          else
            echo "mode=none" >> "${GITHUB_OUTPUT}"
            echo "plugins=" >> "${GITHUB_OUTPUT}"
            echo "no plugin changes: regenerating catalog from current assets"
          fi

  catalog:
    needs: [changed]
    uses: ./.github/workflows/_release-aggregate.yml
    with:
      wait_mode: ${{ needs.changed.outputs.mode }}
      wait_plugins: ${{ needs.changed.outputs.plugins }}

  mark-built:
    needs: [catalog]
    if: github.ref == 'refs/heads/master' && needs.catalog.result == 'success' && needs.catalog.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Point nightly-build at this commit
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          if [ -z "${remote_head}" ]; then
            echo "cannot read remote master HEAD" >&2
            exit 1
          fi
          if [ "${remote_head}" != "${GITHUB_SHA}" ]; then
            echo "master HEAD is ${remote_head}, this run is ${GITHUB_SHA}; skipping nightly-build tag update"
            exit 0
          fi
          git tag -f nightly-build "${GITHUB_SHA}"
          git push -f origin "refs/tags/nightly-build"
