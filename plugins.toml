# lanlup 插件清单 —— xtask / CI 生成的唯一事实源
#
# 字段：
#   name    —— 逻辑名（catalog 中的 canonical 名，含 -rs 后缀）
#   dir     —— 仓库内的 crate 目录
#   package —— Cargo.toml 的 [package].name（当前与 dir 相同）
#   kind    —— 插件类型，对应 lanlu_plugin_info 的 type/plugin_type
#              （metadata / download / login / source / script）
#   max_size_bytes —— 可选，check-wasm 的体积上限；缺省只报告不阻断
schema = 1

