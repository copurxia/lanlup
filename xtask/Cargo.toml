[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

# P0：独立 workspace 自我隔离，避免被未来根 workspace 意外吸收；
# P4 建立根 workspace 时删除本表，并把 xtask 加入 default-members 排除列表。
[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
wasmparser = "0.263"
