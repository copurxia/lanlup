name: CI nhlogin-rs (wasip1)

on:
  push:
    paths:
      - 'nhlogin-rs/**'
      - '.gitea/workflows/nhlogin-rs-wasip1.yml'
      - '.gitea/workflows/_build-wasip1.yml'
  pull_request:
    paths:
      - 'nhlogin-rs/**'
      - '.gitea/workflows/nhlogin-rs-wasip1.yml'
      - '.gitea/workflows/_build-wasip1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.gitea/workflows/_build-wasip1.yml
    with:
      plugin: nhlogin-rs
