# Forgejo 专用副本：Gitea/Forgejo 只要存在 .gitea/workflows 就完全忽略 .github/workflows。
# Forgejo 不支持 Artifact v4 协议，本目录必须保持 upload/download-artifact@v3。
# GitHub 版本见 .github/workflows/ 下的同名文件。
name: Reusable Aggregate Release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      artifact-count: ${{ steps.aggregate.outputs.artifact-count }}
      total-size: ${{ steps.aggregate.outputs.total-size }}
      package-name: ${{ steps.aggregate.outputs.package-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Download all plugin artifacts
        # v4 的 pattern/merge-multiple 为 v4 独有参数；Forgejo 只支持 v3 协议。
        # v3 不带 name 即下载全部 artifact，每个落到 path/<artifact-name>/ 子目录，
        # 与 v4 pattern="*-wasip1"+merge-multiple:false 的布局等价（同 run 上传的
        # 本就只有 *-wasip1 系列）。
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: 📦 Aggregate all plugins into master package
        id: aggregate
        shell: bash
        run: |
          staging_dir="${{ runner.temp }}/lanlu-plugins-wasip1"
          mkdir -p "${staging_dir}"

          echo "::group::Collecting plugins"
          artifact_count=0
          total_size=0
          declare -A plugin_sizes
          declare -A plugin_shas
          plugin_list="[]"

          # v3 会同时下载 *-wasip1-package，这里只处理原始 wasm artifact
          for dir in artifacts/*-wasip1/; do
            [ -d "${dir}" ] || continue
            plugin_name="$(basename "${dir}")"
            wasm_files=("${dir}"*.wasm)
            if [ ${#wasm_files[@]} -eq 0 ]; then
              echo "  ⚠️  ${plugin_name}: no .wasm found, skipping"
              continue
            fi
            wasm_file="${wasm_files[0]}"
            wasm_name="$(basename "${wasm_file}")"
            wasm_size="$(stat --printf='%s' "${wasm_file}")"
            cp "${wasm_file}" "${staging_dir}/${wasm_name}"
            plugin_sizes["${plugin_name}"]=${wasm_size}
            plugin_shas["${plugin_name}"]="$(sha256sum "${wasm_file}" | cut -d' ' -f1)"
            total_size=$((total_size + wasm_size))
            artifact_count=$((artifact_count + 1))
            echo "  ✅ ${plugin_name}: ${wasm_name} ($(numfmt --to=iec-i ${wasm_size}))"
          done
          echo "::endgroup::"

          # 逐个读取插件元数据（名称/描述/图标/依赖），用 jq 组装 JSON
          timestamp="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          info_lines="$(mktemp)"
          for dir in artifacts/*-wasip1/; do
            [ -d "${dir}" ] || continue
            plugin_name="$(basename "${dir}")"
            wasm_files=("${dir}"*.wasm)
            [ ${#wasm_files[@]} -eq 0 ] && continue
            wasm_file="${wasm_files[0]}"
            wasm_name="$(basename "${wasm_file}")"
            info_json='{}'
            if command -v node >/dev/null 2>&1; then
              info_json="$(node scripts/plugin-info.js "${wasm_file}" 2>/dev/null || printf '{}')"
            fi
            if ! printf '%s' "${info_json}" | jq -e . >/dev/null 2>&1; then
              info_json='{}'
            fi
            jq -cn \
              --arg plugin "${plugin_name}" \
              --arg asset "${plugin_name}.wasm" \
              --arg artifact "${wasm_name}" \
              --argjson size "${plugin_sizes[${plugin_name}]}" \
              --arg sha "${plugin_shas[${plugin_name}]}" \
              --argjson info "${info_json}" \
              '{
                plugin: $plugin,
                asset: $asset,
                artifact: $artifact,
                size_bytes: $size,
                sha256: $sha,
                namespace: ($info.namespace // ""),
                name: ($info.name // ""),
                version: ($info.version // ""),
                type: ($info.type // $info.plugin_type // ""),
                description: ($info.description // ""),
                icon: ($info.icon // ""),
                author: ($info.author // ""),
                tags: ($info.tags // ""),
                pre: ($info.pre // [])
              }' >> "${info_lines}"
          done

          jq -s \
            --argjson count "${artifact_count}" \
            --argjson total "${total_size}" \
            --arg version "${GITHUB_SHA::7}" \
            --arg created "${timestamp}" \
            --arg commit "${GITHUB_SHA}" \
            --arg ref "${GITHUB_REF_NAME}" \
            '{
              schema: 1,
              channel: "nightly",
              name: "lanlu-wasip1-plugins",
              version: $version,
              created: $created,
              plugin_count: $count,
              total_size_bytes: $total,
              commit: $commit,
              ref: $ref,
              plugins: .
            }' "${info_lines}" > "${staging_dir}/metadata.json"
          rm -f "${info_lines}"

          # 独立发布一份索引资产，供客户端下载在线插件列表
          cp "${staging_dir}/metadata.json" "${{ runner.temp }}/plugins.json"

          # Create compressed master package
          version="${GITHUB_SHA::7}"
          package_name="lanlu-plugins-wasip1-${version}.tar.gz"
          package_path="${{ runner.temp }}/${package_name}"
          tar -czf "${package_path}" -C "${{ runner.temp }}" "lanlu-plugins-wasip1"

          package_size="$(stat --printf='%s' "${package_path}")"
          echo "artifact-count=${artifact_count}" >> "${GITHUB_OUTPUT}"
          echo "total-size=${total_size}" >> "${GITHUB_OUTPUT}"
          echo "package-name=${package_name}" >> "${GITHUB_OUTPUT}"

          echo "✅ Master package: ${package_name}"
          echo "   Plugins: ${artifact_count}"
          echo "   Total wasm size: $(numfmt --to=iec-i ${total_size})"
          echo "   Package size: $(numfmt --to=iec-i ${package_size})"

      - name: ⬆ Upload aggregate package
        uses: actions/upload-artifact@v3
        with:
          name: lanlu-plugins-wasip1-aggregate
          path: ${{ runner.temp }}/${{ steps.aggregate.outputs.package-name }}
          if-no-files-found: error

      - name: 📋 Aggregate build summary
        if: always()
        shell: bash
        run: |
          count="${{ steps.aggregate.outputs.artifact-count }}"
          total="${{ steps.aggregate.outputs.total-size }}"
          pkg="${{ steps.aggregate.outputs.package-name }}"
          echo "## 📦 Aggregate Release Summary" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Item | Value |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|------|-------|" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Plugins bundled | ${count} |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Total wasm size | $(numfmt --to=iec-i ${total}) (${total} bytes) |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Package | ${pkg} |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Commit | ${GITHUB_SHA::7} |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Ref | ${GITHUB_REF_NAME} |" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "### Plugins included" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| # | Plugin | Artifact | Size |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|---|--------|----------|------|" >> "${GITHUB_STEP_SUMMARY}"
          index=0
          for dir in artifacts/*-wasip1/; do
            [ -d "${dir}" ] || continue
            plugin_name="$(basename "${dir}")"
            wasm_files=("${dir}"*.wasm)
            [ ${#wasm_files[@]} -eq 0 ] && continue
            wasm_file="${wasm_files[0]}"
            wasm_name="$(basename "${wasm_file}")"
            wasm_size="$(stat --printf='%s' "${wasm_file}")"
            index=$((index + 1))
            echo "| ${index} | ${plugin_name} | ${wasm_name} | $(numfmt --to=iec-i ${wasm_size}) |" >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: 🚀 Publish aggregate to nightly release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          # action-gh-release 在 Forgejo 上会把请求打到 web 路由（POST 405），
          # 这里直接用 /api/v1 上传到 nightly release。
          bash "${{ github.workspace }}/.gitea/scripts/publish-nightly-release-asset.sh" \
            "${{ runner.temp }}/${{ steps.aggregate.outputs.package-name }}"
          bash "${{ github.workspace }}/.gitea/scripts/publish-nightly-release-asset.sh" \
            "${{ runner.temp }}/plugins.json"