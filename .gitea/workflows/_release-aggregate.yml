# Forgejo 专用副本：Gitea/Forgejo 只要存在 .gitea/workflows 就完全忽略 .github/workflows。
# Forgejo 不支持 Artifact v4 协议，本目录必须保持 upload/download-artifact@v3。
# GitHub 版本见 .github/workflows/ 下的同名文件。
name: Reusable Catalog Release

# Rebuild plugins.json from published <plugin>-wasip1.wasm assets without
# compiling plugins. Unchanged entries are reused from the previous catalog;
# only the plugins that were rebuilt for this push are downloaded.

on:
  workflow_call:
    inputs:
      wait_mode:
        required: true
        type: string
      wait_plugins:
        required: false
        type: string
        default: ''
    outputs:
      published:
        description: 'Whether this run published the catalog'
        value: ${{ jobs.catalog.outputs.published }}

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      published: ${{ steps.guard2.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      API_BASE: ${{ github.server_url }}/api/v1
      AUTH_HEADER: token ${{ github.token }}
      WAIT_MODE: ${{ inputs.wait_mode }}
      WAIT_PLUGINS: ${{ inputs.wait_plugins }}
      RUNS_URL: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/runs?limit=50
      PAGE_SIZE: '50'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch previous catalog
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          echo "[step] previous $(date -u +%FT%TZ)"
          release_json="$(curl -fsSL --max-time 30 -H "Authorization: ${AUTH_HEADER}" "${API_BASE}/repos/${REPO}/releases/tags/nightly" || true)"
          url=""
          if [ -n "${release_json}" ]; then
            url="$(printf '%s' "${release_json}" | jq -r '.assets[]? | select(.name == "plugins.json") | .browser_download_url' | head -n 1)"
          fi
          if [ -n "${url}" ] && curl -fsSL --max-time 60 -H "Authorization: ${AUTH_HEADER}" -o previous-plugins.json "${url}" && jq -e '.plugins | type == "array"' previous-plugins.json >/dev/null 2>&1; then
            created="$(jq -r '.created // empty' previous-plugins.json)"
            created_epoch=""
            if [ -n "${created}" ]; then
              created_epoch="$(date -u -d "${created}" +%s 2>/dev/null || true)"
            fi
            echo "previous catalog: commit=$(jq -r '.commit // "?"' previous-plugins.json) created=${created:-unknown}"
            echo "available=true" >> "${GITHUB_OUTPUT}"
            echo "created_epoch=${created_epoch}" >> "${GITHUB_OUTPUT}"
          else
            rm -f previous-plugins.json
            echo "previous catalog: unavailable"
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "created_epoch=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Record baseline
        id: baseline
        shell: bash
        env:
          PREV_EPOCH: ${{ steps.previous.outputs.created_epoch }}
        run: |
          set -euo pipefail
          echo "[step] baseline $(date -u +%FT%TZ)"
          commit_epoch="$(git log -1 --format=%ct "${GITHUB_SHA}")"
          base="${commit_epoch}"
          if [ -n "${PREV_EPOCH:-}" ] && [ "${PREV_EPOCH}" -gt "${base}" ]; then
            echo "previous catalog created (${PREV_EPOCH}) is newer than commit (${commit_epoch}); using previous"
            base="${PREV_EPOCH}"
          fi
          now="$(date -u +%s)"
          if [ "${base}" -gt "${now}" ]; then
            echo "baseline source ${base} is in the future; clamping to now"
            base="${now}"
          fi
          epoch=$((base - 60))
          echo "epoch=${epoch}" >> "${GITHUB_OUTPUT}"
          echo "baseline: $(date -u -d "@${epoch}" '+%Y-%m-%dT%H:%M:%SZ') (max(commit, previous catalog) - 60s)"

      - name: Wait for published plugin assets
        if: inputs.wait_mode != 'none'
        shell: bash
        env:
          BASELINE: ${{ steps.baseline.outputs.epoch }}
        run: |
          set -euo pipefail
          echo "[step] wait $(date -u +%FT%TZ)"
          expected="$(mktemp)"
          trap 'rm -f "${expected}"' EXIT
          if [ "${WAIT_MODE}" = "list" ]; then
            printf '%s\n' "${WAIT_PLUGINS}" | tr ',' '\n' | sed '/^$/d; s/$/-wasip1.wasm/' > "${expected}"
          else
            sed -nE 's/^name = "([^"]+)"$/\1-wasip1.wasm/p' plugins.toml > "${expected}"
          fi
          echo "wait_mode=${WAIT_MODE}; expecting $(wc -l < "${expected}") fresh asset(s); baseline epoch ${BASELINE}"

          deadline=$(( $(date -u +%s) + 7200 ))
          while :; do
            release_json="$(curl -fsSL --max-time 30 -H "Authorization: ${AUTH_HEADER}" "${API_BASE}/repos/${REPO}/releases/tags/nightly" || true)"
            if [ -z "${release_json}" ]; then
              echo "[wait] $(date -u +%FT%TZ) release API request failed; retrying in 30s"
              sleep 30
              continue
            fi
            pending=0
            pending_names=""
            while IFS= read -r name; do
              [ -n "${name}" ] || continue
              ts="$(printf '%s' "${release_json}" | jq -r --arg n "${name}" '.assets[]? | select(.name == $n) | (.updated_at // .created_at // empty)' | head -n 1)"
              if [ -z "${ts}" ]; then
                pending=$((pending + 1))
                pending_names="${pending_names} ${name}(missing)"
                continue
              fi
              epoch="$(date -u -d "${ts}" +%s)"
              if [ "${epoch}" -lt "${BASELINE}" ]; then
                pending=$((pending + 1))
                pending_names="${pending_names} ${name}(${ts})"
              fi
            done < "${expected}"
            if [ "${pending}" -eq 0 ]; then
              echo "[wait] $(date -u +%FT%TZ) all expected assets are fresh"
              break
            fi
            echo "[wait] $(date -u +%FT%TZ) pending=${pending}:${pending_names}"
            if [ "$(date -u +%s)" -ge "${deadline}" ]; then
              echo "timeout waiting for ${pending} asset(s)" >&2
              exit 1
            fi
            sleep 30
          done

      - name: Settle (no in-flight plugin builds on master)
        shell: bash
        run: |
          set -euo pipefail
          echo "[step] settle $(date -u +%FT%TZ)"
          sleep 30
          all_runs="$(mktemp)"
          trap 'rm -f "${all_runs}"' EXIT
          deadline=$(( $(date -u +%s) + 7200 ))
          while :; do
            : > "${all_runs}"
            page=1
            page_failed=0
            while :; do
              page_json="$(curl -fsSL --max-time 30 -H "Authorization: ${AUTH_HEADER}" "${RUNS_URL}&page=${page}" || true)"
              if [ -z "${page_json}" ]; then
                page_failed=1
                break
              fi
              n="$(printf '%s' "${page_json}" | jq -r '(.workflow_runs // .runs // []) | length')"
              printf '%s' "${page_json}" | jq -c '(.workflow_runs // .runs // [])[]' >> "${all_runs}"
              [ "${n}" -lt "${PAGE_SIZE}" ] && break
              page=$((page + 1))
              [ "${page}" -gt 100 ] && break
            done
            if [ "${page_failed}" -eq 1 ]; then
              echo "[settle] $(date -u +%FT%TZ) runs API request failed; retrying in 30s"
              sleep 30
              continue
            fi

            failed="$(jq -s -r --arg branch master --arg sha "${GITHUB_SHA}" '
              [ .[]
                  | select(((.head_branch // .prettyref // "") | tostring) == $branch)
                  | select(((.head_sha // .commit_sha // "") | tostring) == $sha)
                  | select(.status == "failure" or .status == "cancelled")
                  | select((((.path // .workflow_id // "") | tostring) | test("-wasip1\\.yml$")))
                  | select((((.path // .workflow_id // "") | tostring) | test("_build-wasip1\\.yml$")) | not)
                  | ((.path // .workflow_id // "") | tostring | split("/") | last)
                ] | join(", ")' "${all_runs}")"
            if [ -n "${failed}" ]; then
              echo "[settle] $(date -u +%FT%TZ) plugin build(s) FAILED for current commit ${GITHUB_SHA:0:7}: ${failed}" >&2
              exit 1
            fi

            details="$(jq -s -r --arg branch master '
              .[]
              | select(((.head_branch // .prettyref // "") | tostring) == $branch)
              | select(.status != "completed" and .status != "success" and .status != "failure" and .status != "cancelled" and .status != "skipped")
              | select((((.path // .workflow_id // "") | tostring) | test("-wasip1\\.yml$")))
              | select((((.path // .workflow_id // "") | tostring) | test("_build-wasip1\\.yml$")) | not)
              | [ ((.path // .workflow_id // "") | tostring | split("/") | last), .status, (((.head_sha // .commit_sha // "") | tostring)[0:7]) ]
              | @tsv' "${all_runs}")"
            pending="$(printf '%s' "${details}" | grep -c . || true)"
            echo "[settle] $(date -u +%FT%TZ) in-flight=${pending}"
            printf '%s\n' "${details}" | while IFS=$'\t' read -r wf st sha; do
              if [ -n "${wf}" ]; then
                echo "  plugin_run=${wf} status=${st} sha=${sha}"
              fi
            done
            [ "${pending}" -eq 0 ] && break
            if [ "$(date -u +%s)" -ge "${deadline}" ]; then
              echo "timeout waiting for ${pending} in-flight plugin build(s)" >&2
              exit 1
            fi
            sleep 30
          done

      - name: "Guard: master HEAD is this commit"
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          echo "[step] guard $(date -u +%FT%TZ)"
          branch_json="$(curl -fsSL --max-time 30 -H "Authorization: ${AUTH_HEADER}" "${API_BASE}/repos/${REPO}/branches/master" || true)"
          if [ -z "${branch_json}" ]; then
            echo "cannot read master HEAD; refusing to publish" >&2
            exit 1
          fi
          head_sha="$(printf '%s' "${branch_json}" | jq -r '.commit.sha // .commit.id // empty')"
          if [ -z "${head_sha}" ]; then
            echo "cannot parse master HEAD; refusing to publish" >&2
            exit 1
          fi
          if [ "${head_sha}" != "${GITHUB_SHA}" ]; then
            echo "master HEAD is ${head_sha}, this run is ${GITHUB_SHA}; skipping publish (newer run owns the catalog)"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "publish=true" >> "${GITHUB_OUTPUT}"

      - name: Download wasm assets (refreshed only)
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "[step] download $(date -u +%FT%TZ)"
          release_json="$(curl -fsSL --max-time 30 -H "Authorization: ${AUTH_HEADER}" "${API_BASE}/repos/${REPO}/releases/tags/nightly")"
          printf '%s' "${release_json}" | jq -r '.assets[]? | select(.name | endswith("-wasip1.wasm")) | [.name, (.size|tostring), .browser_download_url] | @tsv' > assets.tsv

          expected="$(mktemp)"
          sed -nE 's/^name = "([^"]+)"$/\1/p' plugins.toml | sort > "${expected}"

          case "${WAIT_MODE}" in
            all) refresh_all=1; refresh_list="" ;;
            list) refresh_all=0; refresh_list=",${WAIT_PLUGINS}," ;;
            *) refresh_all=0; refresh_list="" ;;
          esac

          dl_list="$(mktemp)"
          trap 'rm -f "${expected}" "${dl_list}"' EXIT
          : > "${dl_list}"
          while IFS= read -r plugin; do
            [ -n "${plugin}" ] || continue
            want=0
            if [ "${refresh_all}" -eq 1 ]; then
              want=1
            else
              case "${refresh_list}" in *",${plugin},"*) want=1 ;; esac
            fi
            if [ "${want}" -eq 0 ] && [ -f previous-plugins.json ]; then
              prev="$(jq -c --arg p "${plugin}" '
                .plugins[]?
                | select(.plugin == $p)
                | select(.asset == ($p + "-wasip1.wasm"))
                | select((.type // "") | length > 0)
                | select((.sha256 // "") | test("^[0-9a-f]{64}$"))
                | select((.size_bytes // 0) > 0)
              ' previous-plugins.json | head -n 1)"
              if [ -n "${prev}" ]; then
                prev_size="$(printf '%s' "${prev}" | jq -r '.size_bytes')"
                asset_size="$(awk -F'\t' -v n="${plugin}-wasip1.wasm" '$1 == n { print $2 }' assets.tsv | head -n 1)"
                if [ -n "${asset_size}" ] && [ "${asset_size}" = "${prev_size}" ]; then
                  echo "reuse ${plugin} (asset size ${asset_size} matches previous catalog)"
                  continue
                fi
              fi
            fi
            entry="$(awk -F'\t' -v n="${plugin}-wasip1.wasm" '$1 == n { print $1 " " $3 }' assets.tsv | head -n 1)"
            if [ -z "${entry}" ]; then
              echo "release is missing asset ${plugin}-wasip1.wasm" >&2
              exit 1
            fi
            printf '%s\n' "${entry}" >> "${dl_list}"
          done < "${expected}"

          download_count="$(grep -c . "${dl_list}" || true)"
          echo "download plan: ${download_count} asset(s)"
          rm -rf wasm
          mkdir -p wasm
          if [ "${download_count}" -gt 0 ]; then
            xargs -r -P 8 -n 2 -a "${dl_list}" bash -c '
              name="$1"; url="$2"
              echo "downloading ${name}"
              curl -fsSL --retry 3 --retry-delay 2 --max-time 300 -H "Authorization: ${AUTH_HEADER}" -o "wasm/${name}" "${url}"
            ' _
          fi

          while IFS= read -r plugin; do
            [ -n "${plugin}" ] || continue
            need=0
            if [ "${refresh_all}" -eq 1 ]; then need=1; else case "${refresh_list}" in *",${plugin},"*) need=1 ;; esac; fi
            if [ "${need}" -eq 1 ] && [ ! -f "wasm/${plugin}-wasip1.wasm" ]; then
              echo "refresh asset missing after download: ${plugin}" >&2
              exit 1
            fi
          done < "${expected}"
          echo "[step] download done $(date -u +%FT%TZ)"

      - name: Build catalog and package
        id: build
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "[step] build $(date -u +%FT%TZ)"
          refresh_arg=""
          case "${WAIT_MODE}" in
            all) refresh_arg="all" ;;
            list) refresh_arg="${WAIT_PLUGINS}" ;;
            *) refresh_arg="" ;;
          esac
          prev_args=()
          if [ -f previous-plugins.json ]; then
            prev_args=(--previous-catalog previous-plugins.json)
          fi
          bash scripts/build-plugin-catalog.sh \
            --wasm-dir wasm \
            --plugins-toml plugins.toml \
            --out-dir out \
            --commit "${GITHUB_SHA}" \
            --ref "${GITHUB_REF_NAME}" \
            --channel nightly \
            ${prev_args[@]+"${prev_args[@]}"} \
            --refresh-plugins "${refresh_arg}"
          pkg="$(ls out/lanlu-plugins-wasip1-*.tar.gz 2>/dev/null | head -n 1 || true)"
          echo "package=${pkg}" >> "${GITHUB_OUTPUT}"
          echo "[step] build done $(date -u +%FT%TZ)"

      - name: "Guard 2: master HEAD still this commit"
        id: guard2
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "[step] guard2 $(date -u +%FT%TZ)"
          branch_json="$(curl -fsSL --max-time 30 -H "Authorization: ${AUTH_HEADER}" "${API_BASE}/repos/${REPO}/branches/master" || true)"
          if [ -z "${branch_json}" ]; then
            echo "cannot read master HEAD; refusing to publish" >&2
            exit 1
          fi
          head_sha="$(printf '%s' "${branch_json}" | jq -r '.commit.sha // .commit.id // empty')"
          if [ -z "${head_sha}" ]; then
            echo "cannot parse master HEAD; refusing to publish" >&2
            exit 1
          fi
          if [ "${head_sha}" != "${GITHUB_SHA}" ]; then
            echo "master HEAD moved to ${head_sha} during this run; skipping publish (newer run owns the catalog)"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "publish=true" >> "${GITHUB_OUTPUT}"

      - name: 🚀 Publish catalog (plugins.json)
        if: steps.guard.outputs.publish == 'true' && steps.guard2.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "[step] publish-json $(date -u +%FT%TZ)"
          bash "${{ github.workspace }}/.gitea/scripts/publish-nightly-release-asset.sh" out/plugins.json

      - name: 🚀 Publish aggregate bundle
        if: steps.guard.outputs.publish == 'true' && steps.guard2.outputs.publish == 'true' && steps.build.outputs.package != ''
        shell: bash
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "[step] publish-bundle $(date -u +%FT%TZ)"
          bash "${{ github.workspace }}/.gitea/scripts/publish-nightly-release-asset.sh" \
            "${{ steps.build.outputs.package }}"

      - name: Remove stale aggregate packages
        if: steps.guard.outputs.publish == 'true' && steps.guard2.outputs.publish == 'true' && steps.build.outputs.package != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "[step] cleanup $(date -u +%FT%TZ)"
          current="$(basename "${{ steps.build.outputs.package }}")"
          release_json="$(curl -fsSL --max-time 30 -H "Authorization: ${AUTH_HEADER}" "${API_BASE}/repos/${REPO}/releases/tags/nightly")"
          release_id="$(printf '%s' "${release_json}" | jq -r '.id')"
          printf '%s' "${release_json}" | jq -r --arg current "${current}" '
            .assets[]?
            | select(.name | test("^lanlu-plugins-wasip1-.*\\.tar\\.gz$"))
            | select(.name != $current)
            | [.id, .name] | @tsv
          ' | while IFS=$'\t' read -r id name; do
            [ -n "${id}" ] || continue
            echo "deleting stale aggregate package ${name} (id=${id})"
            curl -fsSL -X DELETE -H "Authorization: ${AUTH_HEADER}" "${API_BASE}/repos/${REPO}/releases/${release_id}/assets/${id}" >/dev/null
          done

      - name: 📋 Catalog summary
        if: always()
        shell: bash
        env:
          PUBLISHED: ${{ steps.guard2.outputs.publish }}
        run: |
          {
            echo "## 📦 Catalog refresh"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Commit | ${GITHUB_SHA::7} |"
            echo "| Ref | ${GITHUB_REF_NAME} |"
            echo "| Wait mode | ${WAIT_MODE} |"
            echo "| Published | ${PUBLISHED:-not-published} |"
            if [ -f out/plugins.json ]; then
              echo "| Plugins | $(jq -r '.plugin_count' out/plugins.json) |"
              echo "| Total size | $(jq -r '.total_size_bytes' out/plugins.json) bytes |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
