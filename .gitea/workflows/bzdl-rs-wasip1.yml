name: CI bzdl-rs (wasip1)

on:
  push:
    paths:
      - 'bzdl-rs/**'
      - '.gitea/workflows/bzdl-rs-wasip1.yml'
      - '.gitea/workflows/_build-wasip1.yml'
  pull_request:
    paths:
      - 'bzdl-rs/**'
      - '.gitea/workflows/bzdl-rs-wasip1.yml'
      - '.gitea/workflows/_build-wasip1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.gitea/workflows/_build-wasip1.yml
    with:
      plugin: bzdl-rs
