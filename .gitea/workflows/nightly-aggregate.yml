# Forgejo 专用副本：Gitea/Forgejo 只要存在 .gitea/workflows 就完全忽略 .github/workflows。
# Forgejo 不支持 Artifact v4 协议，本目录必须保持 upload/download-artifact@v3。
# GitHub 版本见 .github/workflows/ 下的同名文件。
name: Nightly Aggregate Release

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      plugins:
        description: 'Comma-separated list of plugins to build (empty = all)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  list-plugins:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        shell: bash
        run: |
          # Find all plugin workflow files (excluding templates)
          plugins=()
          for wf in .gitea/workflows/*-rs-wasip1.yml; do
            # Keep the `-rs` suffix because it is part of the plugin directory
            # name (for example, ehentai-rs-wasip1.yml -> ehentai-rs).
            plugin="$(basename "${wf}" -wasip1.yml)"
            plugins+=("${plugin}")
          done
          # If user specified plugins, filter
          if [ -n "${{ inputs.plugins }}" ]; then
            IFS=',' read -ra specified <<< "${{ inputs.plugins }}"
            filtered=()
            for spec in "${specified[@]}"; do
              spec="$(echo "${spec}" | xargs)"
              for plugin in "${plugins[@]}"; do
                if [ "${plugin}" = "${spec}" ]; then
                  filtered+=("${plugin}")
                fi
              done
            done
            plugins=("${filtered[@]}")
          fi
          echo "matrix=$(printf '%s\n' "${plugins[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "${GITHUB_OUTPUT}"

  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        shell: bash
        run: |
          last="$(git rev-list -n 1 refs/tags/nightly-build 2>/dev/null || true)"
          if [ -n "${last}" ] && [ "${last}" = "${GITHUB_SHA}" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "HEAD ${GITHUB_SHA} 与上次聚合一致，跳过"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "HEAD ${GITHUB_SHA}，上次聚合 ${last:-<none>}"
          fi

  build:
    needs: [list-plugins, check]
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.list-plugins.outputs.matrix) }}
    uses: ./.gitea/workflows/_build-wasip1.yml
    with:
      plugin: ${{ matrix.plugin }}

  aggregate:
    needs: [check, build]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.check.outputs.changed == 'true')
    uses: ./.gitea/workflows/_release-aggregate.yml

  mark-built:
    needs: [build, aggregate]
    if: github.event_name == 'schedule' && needs.build.result == 'success' && needs.aggregate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 🏷️ Record last aggregated commit
        shell: bash
        run: |
          git tag -f nightly-build "${GITHUB_SHA}"
          git push -f origin "refs/tags/nightly-build"
